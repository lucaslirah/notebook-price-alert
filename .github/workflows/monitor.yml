name: Monitor de preço de notebooks

on:
  schedule:
    # A cada 5 minutos (o mínimo do GitHub Actions). Horário em UTC. O GitHub
    # costuma atrasar execuções agendadas em horários de pico: não é exato.
    - cron: "*/5 * * * *"
  # Permite disparar manualmente pela aba Actions do GitHub.
  workflow_dispatch:

# Necessário para que o workflow consiga commitar o state.json atualizado.
permissions:
  contents: write

# Evita execuções sobrepostas.
concurrency:
  group: monitor-notebooks
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # O navegador só é necessário se a Kabum direta estiver habilitada (lento).
      - name: Instalar navegador do Playwright (se Kabum direta estiver ligada)
        run: |
          if python - <<'PY'
          import sys, yaml
          cfg = yaml.safe_load(open("config.yaml", encoding="utf-8"))
          ligado = any(l.get("adaptador") == "kabum" and l.get("habilitado", True)
                       for l in cfg.get("lojas", []))
          sys.exit(0 if ligado else 1)
          PY
          then
            python -m playwright install --with-deps chromium
          else
            echo "Kabum direta desligada; pulando o Playwright."
          fi

      - name: Rodar monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Opcionais: só para ler grupos PRIVADOS do Telegram (veja o README).
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python monitor.py

      - name: Persistir estado (anti-spam)
        if: always()
        run: |
          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "state.json sem alterações; nada a commitar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: atualiza state.json [skip ci]"
          # Puxa mudanças remotas antes de empurrar (evita erro 'fetch first').
          for i in 1 2 3; do
            git pull --rebase --autostash origin main || true
            if git push origin main; then
              echo "state.json enviado."
              exit 0
            fi
            echo "push rejeitado (tentativa $i); tentando novamente..."
            sleep 3
          done
          echo "::warning::Não consegui enviar o state.json após 3 tentativas. O anti-spam pode reenviar um alerta na próxima execução."
