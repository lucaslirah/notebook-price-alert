name: Monitor de preço de notebooks

on:
  schedule:
    # Roda a cada 30 minutos. Horário em UTC (o cron do GitHub usa UTC).
    - cron: "*/30 * * * *"
  # Permite disparar manualmente pela aba Actions do GitHub.
  workflow_dispatch:

# Necessário para que o workflow consiga commitar o state.json atualizado.
permissions:
  contents: write

# Evita execuções sobrepostas.
concurrency:
  group: monitor-notebooks
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Instalar navegador do Playwright (para a Kabum)
        run: python -m playwright install --with-deps chromium

      - name: Rodar monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Persistir estado (anti-spam)
        run: |
          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "state.json sem alterações; nada a commitar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: atualiza state.json [skip ci]"
          # Puxa mudanças remotas antes de empurrar (evita erro 'fetch first').
          # Tenta algumas vezes caso o main avance nesse meio-tempo.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main || true
            if git push origin main; then
              echo "state.json enviado."
              exit 0
            fi
            echo "push rejeitado (tentativa $i); tentando novamente..."
            sleep 3
          done
          echo "::warning::Não consegui enviar o state.json após 3 tentativas. O anti-spam pode reenviar um alerta na próxima execução."
